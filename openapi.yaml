openapi: 3.1.0
info:
  title: HukumID Evidence-First API
  version: 0.8.2
  description: API riset hukum Indonesia. Metadata pencarian bukan evidence isi.
  license:
    name: MIT
    identifier: MIT
security: []
servers:
  - url: http://localhost:3001
    description: Local development
tags:
  - name: Research
    description: Pencarian, verifikasi sitasi, sintesis, dan unggahan.
  - name: Documents
    description: Dokumen hukum dan garis waktu regulasi.
  - name: Operations
    description: Kesehatan layanan, sumber, dan status job.
paths:
  /v2/rumpun:
    get:
      summary: Profil enam rumpun dan batas cakupan
      operationId: profilRumpunV2
      tags: [Research]
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }
        "200":
          description: Profil sumber, hierarki, contoh isu, dan cakupan terbatas
          content:
            application/json:
              schema: { type: object, required: [data, meta], properties: { data: { type: object, additionalProperties: true }, meta: { $ref: "#/components/schemas/Meta" } } }
  /v2/telusur:
    post:
      summary: Telusur lintas sumber tanpa akun atau AI
      operationId: telusurV2
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rumpun, query]
              properties:
                rumpun: { $ref: "#/components/schemas/RumpunV2" }
                query: { type: string, minLength: 2, maxLength: 300 }
                sumber: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/JenisTelusurV2" } }
                limit: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Kandidat metadata, status pemeriksaan per sumber, dan peringatan cakupan
          content:
            application/json:
              schema: { type: object, required: [data, meta], properties: { data: { type: object, additionalProperties: true }, meta: { $ref: "#/components/schemas/Meta" } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v2/sumber/unggahan:
    post:
      summary: Cocokkan sidik PDF lokal dengan korpus publik
      operationId: cocokkanUnggahanV2
      tags: [Documents]
      description: Hanya menerima sidik SHA-256. Berkas dan teks unggahan tidak dikirim atau disimpan. Sidik yang cocok tidak menandatangani teks dari klien.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [fileHash], properties: { fileHash: { type: string, pattern: '^[a-f0-9]{64}$' } } }
      responses:
        "200":
          description: hash_korpus_cocok atau unggahan_tidak_terverifikasi
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v2/sumber/potongan:
    post:
      summary: Alias pembukaan potongan sumber
      operationId: potonganSumberV2
      tags: [Documents]
      requestBody: { $ref: "#/paths/~1v2~1sumber~1buka/post/requestBody" }
      responses:
        "200": { $ref: "#/paths/~1v2~1sumber~1buka/post/responses/200" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v2/laporan/rencana:
    post:
      summary: Susun rencana riset yang dapat disunting
      operationId: rencanaLaporanV2
      tags: [Research]
      description: BYOK dan tiket akun singkat; alternatif preview privat memakai mode managed-azure dengan tiket v2 dan kunci di VPS. Tidak menjawab fakta hukum. Output BYOK maksimal 2500 token, Azure terkelola low/4096 termasuk reasoning; tanpa percobaan ulang otomatis.
      parameters:
        - { $ref: "#/paths/~1v2~1laporan~1sintesis/post/parameters/0" }
        - { $ref: "#/paths/~1v2~1laporan~1sintesis/post/parameters/1" }
        - { $ref: "#/paths/~1v2~1laporan~1sintesis/post/parameters/2" }
        - { $ref: "#/components/parameters/TiketLangkahV2" }
        - { name: X-Pasla-AI-Mode, in: header, schema: { type: string, enum: [managed-azure] }, description: Hanya gateway preview dengan tiket v2 terikat profil Azure. }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [rumpun, pertanyaan], properties: { rumpun: { $ref: "#/components/schemas/RumpunV2" }, pertanyaan: { type: string, minLength: 4, maxLength: 2000 } } }
      responses:
        "200":
          description: NDJSON mulai, proses, lalu hasil rencana bertanda tangan atau galat
          content:
            application/x-ndjson:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v2/laporan/saring:
    post:
      summary: Aturan status deterministik lalu saran relevansi dari kutipan
      operationId: saringLaporanV2
      tags: [Research]
      description: Maksimal 24 kandidat. Tanda tangan, pencabutan, dan ketidakpastian konsolidasi diperiksa sebelum model. Setiap keputusan AI harus menyertakan kutipan persis minimal delapan kata.
      parameters:
        - { $ref: "#/paths/~1v2~1laporan~1sintesis/post/parameters/0" }
        - { $ref: "#/paths/~1v2~1laporan~1sintesis/post/parameters/1" }
        - { $ref: "#/paths/~1v2~1laporan~1sintesis/post/parameters/2" }
        - { $ref: "#/components/parameters/TiketLangkahV2" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rencana, kandidat]
              properties:
                rencana: { $ref: "#/components/schemas/RencanaV2" }
                kandidat:
                  type: array
                  maxItems: 24
                  items:
                    type: object
                    required: [id, judul, statusBuka, potongan]
                    properties:
                      id: { type: string, minLength: 1, maxLength: 100 }
                      judul: { type: string, maxLength: 500 }
                      statusBuka: { type: string, enum: [dibuka, tidak_ditemukan, tidak_dapat_diperiksa] }
                      potongan: { type: array, maxItems: 24, items: { $ref: "#/components/schemas/PotonganV2" } }
      responses:
        "200":
          description: NDJSON mulai, proses, lalu keputusan bertanda tangan atau galat
          content:
            application/x-ndjson:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v2/kunci-publik:
    get:
      summary: Ambil kunci publik penandatangan bukti v2
      operationId: kunciPublikV2
      tags: [Operations]
      responses:
        "200":
          description: Kunci Ed25519 aktif dan kunci publik yang diterima selama rotasi
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [alg, kid, kunci]
                    properties:
                      alg: { const: Ed25519 }
                      kid: { type: string }
                      kunci: { type: array, items: { type: string, description: Kunci publik PEM SPKI } }
                  meta: { $ref: "#/components/schemas/Meta" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v2/sumber/buka:
    post:
      summary: Buka rujukan menjadi potongan bertanda tangan tanpa AI
      operationId: bukaSumberV2
      tags: [Documents]
      description: >-
        Maksimal 8 rujukan dan 20000 byte JSON per permintaan. Mesin membuka sumber sendiri,
        lalu menandatangani metadata dan sidik teksnya. Status tidak_dapat_diperiksa dibedakan
        dari tidak_ditemukan. Kunci penandatangan wajib dikonfigurasi pada server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rujukan]
              properties:
                rujukan: { type: array, minItems: 1, maxItems: 8, items: { $ref: "#/components/schemas/RujukanV2" } }
      responses:
        "200":
          description: Status pembukaan dan potongan per rujukan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/HasilBukaV2" } }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/Meta" }
                      - { type: object, required: [kid], properties: { kid: { type: [string, "null"] } } }
        "400": { $ref: "#/components/responses/InvalidJson" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v2/laporan/sintesis:
    post:
      summary: Sintesis satu bagian laporan dari potongan bertanda tangan
      operationId: sintesisLaporanV2
      tags: [Research]
      description: >-
        BYOK wajib kecuali mode managed-azure preview privat dengan tiket v2 terikat profil;
        mode terkelola memakai kunci hanya pada VPS, low/4096 dan konsumsi tiket persisten.
        Tidak ada percobaan ulang otomatis. Maksimal 24 potongan
        dan 2000000 byte JSON. Potongan yang diubah, bersidik salah, atau bertanda tangan asing
        ditolak sebelum model dipanggil. Hasil mencatat potongan dan kalimat yang ditolak.
        Respons NDJSON dimulai dengan mulai, diikuti proses tiap 10 detik selama model bekerja,
        lalu hasil bertanda tangan atau galat. Tenggat 80 detik termasuk waktu antrean.
        Pembukaan sumber dan sintesis memakai kolam konkurensi terpisah.
      parameters:
        - name: X-Pasla-AI-Provider
          in: header
          description: Wajib pada BYOK; tidak digunakan pada mode managed-azure.
          schema: { type: string, enum: [claude, gemini, openai, openrouter, groq, deepseek, mistral] }
        - name: X-Pasla-AI-Key
          in: header
          description: Wajib pada BYOK; hanya melintas per permintaan dan tidak pernah disimpan atau dipantulkan. Mode managed-azure memakai rahasia VPS.
          schema: { type: string, minLength: 8, maxLength: 512, pattern: '^[\x21-\x7e]{8,512}$' }
        - name: X-Pasla-AI-Model
          in: header
          description: Wajib untuk penyedia kompatibel OpenAI.
          schema: { type: string, pattern: '^[A-Za-z0-9._:/@-]{1,100}$' }
        - { $ref: "#/components/parameters/TiketLangkahV2" }
        - { name: X-Pasla-AI-Mode, in: header, schema: { type: string, enum: [managed-azure] }, description: Hanya gateway preview dengan tiket v2 terikat profil Azure. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pertanyaan, bagian, potongan]
              properties:
                pertanyaan: { type: string, minLength: 4, maxLength: 2000 }
                bagian: { $ref: "#/components/schemas/BagianV2" }
                potongan: { type: array, minItems: 1, maxItems: 24, items: { $ref: "#/components/schemas/PotonganV2" } }
      responses:
        "200":
          description: Satu objek JSON per baris; galat setelah streaming dimulai tetap memakai status HTTP 200
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/PeristiwaSintesisV2" }
        "400": { $ref: "#/components/responses/InvalidJson" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /health:
    get:
      summary: Periksa kesiapan API
      operationId: health
      tags: [Operations]
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { const: ok }
                  service: { const: hukum-id-api }
                  version: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/search:
    get:
      summary: Cari kandidat sumber hukum
      operationId: searchLegalSources
      tags: [Research]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 300 } }
        - { name: sources, in: query, schema: { type: string }, description: Comma-separated source IDs }
        - { name: number, in: query, schema: { type: string, maxLength: 30 } }
        - { name: year, in: query, schema: { type: string, pattern: "^[0-9]{4}$" } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 500 } }
      responses:
        "200":
          description: Kandidat dokumen; belum menjadi evidence isi
          headers:
            X-Trace-Id: { schema: { type: string, format: uuid } }
            X-RateLimit-Limit: { schema: { type: integer } }
            X-RateLimit-Remaining: { schema: { type: integer } }
            X-RateLimit-Reset: { schema: { type: integer } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchEnvelope"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/documents/{id}:
    get:
      summary: Ambil satu dokumen hukum
      operationId: getLegalDocument
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: source
          in: query
          schema: { type: string, enum: [regulation, ma-decision], default: regulation }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/documents/{id}/articles/{article}:
    get:
      summary: Periksa pasal persis secara fail-closed
      operationId: lookupArticle
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: article
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 80 }
      responses:
        "200":
          description: ResearchResult dengan evidence terverifikasi, atau insufficient_evidence bila pasal tidak ditemukan
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/ResearchResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/documents/{id}/timeline:
    get:
      summary: Telusuri garis waktu regulasi
      operationId: getRegulationTimeline
      tags: [Documents]
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - { name: article, in: query, schema: { type: string, maxLength: 80 } }
        - { name: asOf, in: query, schema: { type: string, maxLength: 40 } }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/citations/verify:
    post:
      summary: Verifikasi sitasi dalam draf
      operationId: verifyCitation
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 100000 }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/research:
    post:
      summary: Jalankan riset evidence-first
      operationId: research
      tags: [Research]
      security:
        - {}
        - bearerAuth: []
      description: AI mode requires bearer authentication. BYOK may be sent ephemerally in X-Gemini-Api-Key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 4, maxLength: 5000 }
                useAi: { type: boolean, default: false }
                evidenceIds:
                  type: array
                  maxItems: 40
                  items: { type: string, pattern: "^ev_[a-f0-9]{24}$" }
                documentContext:
                  oneOf:
                    - type: object
                      required: [source]
                      properties: { source: { const: corpus } }
                    - type: object
                      required: [source, uploadId]
                      properties:
                        source: { const: upload }
                        uploadId: { type: string, format: uuid }
      responses:
        "200":
          description: Evidence-first research result
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/ResearchResult" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/ask:
    post:
      summary: Jawab pertanyaan bahasa sehari-hari dari kutipan resmi
      operationId: ask
      tags: [Research]
      description: >-
        AI hanya merencanakan rujukan dan menyusun sintesis dari evidence yang sudah dibuka server.
        Rujukan yang diusulkan AI dibuka lewat exact lookup yang gagal tertutup, sehingga rujukan karangan
        berakhir sebagai "tidak ditemukan". Kunci BYOK dikirim per permintaan lewat header dan tidak disimpan.
        Tanpa kunci, server memakai kunci platform bila tersedia dengan kuota harian per klien.
      parameters:
        - name: X-Pasla-AI-Provider
          in: header
          required: false
          schema: { type: string, enum: [claude, gemini, openai, openrouter, groq, deepseek, mistral] }
        - name: X-Pasla-AI-Model
          in: header
          required: false
          description: Wajib untuk penyedia kompatibel OpenAI. Bawaan Claude adalah claude-opus-5-5.
          schema: { type: string, pattern: "^[A-Za-z0-9._:/@-]{1,100}$" }
        - name: X-Pasla-AI-Key
          in: header
          required: false
          description: Kunci BYOK. Tidak pernah disimpan, dicatat, atau dipantulkan dalam respons.
          schema: { type: string, minLength: 8, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 4, maxLength: 2000 }
                useAi: { type: boolean, default: true }
      responses:
        "200":
          description: Kutipan resmi, kartu sumber dengan status, langkah yang dicoba, dan sintesis bila AI aktif
          headers:
            X-AI-Quota-Remaining:
              description: Sisa kuota AI platform hari ini; hanya ada bila kunci platform dipakai.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/AskResponse" }
                  meta:
                    allOf:
                      - { $ref: "#/components/schemas/Meta" }
                      - type: object
                        properties:
                          notes: { type: array, items: { type: string } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/uploads:
    post:
      summary: Buat tiket unggahan terenkripsi
      operationId: createUpload
      tags: [Research]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUpload" }
      responses:
        "201": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/uploads/{id}/content:
    put:
      summary: Unggah konten PDF atau DOCX
      operationId: putUploadContent
      tags: [Research]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/pdf: { schema: { type: string, format: binary } }
          application/vnd.openxmlformats-officedocument.wordprocessingml.document:
            schema: { type: string, format: binary }
      responses:
        "202": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /v1/jobs/{id}:
    get:
      summary: Ambil status job milik pengguna
      operationId: getJob
      tags: [Operations]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/sources/status:
    get:
      summary: Lihat kesehatan sumber hukum
      operationId: getSourceStatus
      tags: [Operations]
      parameters:
        - { name: importantOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { $ref: "#/components/responses/GenericSuccess" }
        "429": { $ref: "#/components/responses/RateLimited" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TiketLangkahV2:
      name: X-Pasla-Step-Ticket
      in: header
      required: true
      description: Tiket HMAC dari Functions, berlaku 120 detik, terikat akun/attempt/input/anggaran/audience, sekali pakai. Wajib pada konfigurasi produksi.
      schema: { type: string, maxLength: 2500 }
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 500 }
  schemas:
    RumpunV2:
      type: string
      enum: [ilmu-hukum, hes, htn, hukum-keluarga, pidana-islam, perbandingan-madzhab]
    JenisTelusurV2:
      type: string
      enum: [peraturan, fatwa, khes, khi, qanun, putusan, turats, ayat, hadis, literatur]
    RencanaV2:
      type: object
      required: [isu, subpertanyaan, penelusuran, kriteria, bagian]
      properties:
        isu: { type: string, minLength: 4, maxLength: 1000 }
        subpertanyaan: { type: array, minItems: 1, maxItems: 8, items: { type: string, minLength: 4, maxLength: 300 } }
        penelusuran:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [kueri, sumber]
            properties:
              kueri: { type: string, minLength: 2, maxLength: 120 }
              sumber: { type: array, minItems: 1, maxItems: 10, items: { $ref: "#/components/schemas/JenisTelusurV2" } }
        kriteria:
          type: object
          required: [masukkan, keluarkan, sertakanHistoris]
          properties:
            masukkan: { type: array, minItems: 1, maxItems: 6, items: { type: string, minLength: 1, maxLength: 300 } }
            keluarkan: { type: array, maxItems: 6, items: { type: string, minLength: 1, maxLength: 300 } }
            sertakanHistoris: { type: boolean }
        bagian: { type: array, minItems: 1, maxItems: 6, items: { $ref: "#/components/schemas/BagianV2" } }
    TandaV2:
      type: object
      required: [alg, kid, sig]
      properties:
        alg: { const: Ed25519 }
        kid: { type: string }
        sig: { type: string, description: Tanda tangan base64url atas JSON kanonik }
    PasalV2:
      type: string
      pattern: '^Pasal\s+(?:\d{1,4}[A-Z]?|[IVX]{1,6})$'
      description: Judul pasal tanpa ayat; pencocokan huruf besar dan kecil diabaikan.
    RujukanV2:
      oneOf:
        - type: object
          required: [jenis, pasal]
          properties:
            jenis: { const: khi }
            pasal: { $ref: "#/components/schemas/PasalV2" }
        - type: object
          required: [jenis, rujukan]
          properties:
            jenis: { const: qanun }
            rujukan: { type: string, pattern: '^Qanun(?: Aceh)? \d{1,3}/\d{4}$' }
            pasal: { $ref: "#/components/schemas/PasalV2" }
        - type: object
          required: [jenis, id]
          properties:
            jenis: { const: putusan }
            id: { type: string, pattern: '^[a-zA-Z0-9:._-]{1,120}$' }
        - type: object
          required: [jenis, nomor, url]
          properties:
            jenis: { const: putusan-mk-bpk }
            nomor: { type: string, pattern: '^\d{1,4}/PUU-[IVXL]{1,8}/\d{4}$' }
            url: { type: string, format: uri, maxLength: 1000, description: 'HTTPS peraturan.bpk.go.id/DownloadUjiMateri/<id>/<filename>.pdf, tanpa kredensial, query atau fragment. Nama berkas tidak boleh memuat pemisah path tersandi.' }
            halaman: { type: integer, minimum: 1, maximum: 600 }
        - type: object
          required: [jenis, rujukan]
          properties:
            jenis: { const: peraturan }
            rujukan: { type: string, minLength: 3, maxLength: 60 }
            pasal: { $ref: "#/components/schemas/PasalV2" }
        - type: object
          required: [jenis, nomor]
          properties:
            jenis: { const: fatwa }
            nomor: { type: string, pattern: '^\d{1,3}/DSN-MUI/[IVX]+/\d{4}$' }
        - type: object
          required: [jenis, pasal]
          properties:
            jenis: { const: khes }
            pasal: { $ref: "#/components/schemas/PasalV2" }
        - type: object
          required: [jenis, surah, ayat]
          properties:
            jenis: { const: ayat }
            surah: { type: integer, minimum: 1, maximum: 114 }
            ayat: { type: integer, minimum: 1, maximum: 286 }
        - type: object
          required: [jenis, id]
          properties:
            jenis: { const: hadis }
            id: { type: string, pattern: '^\d{1,8}$' }
        - type: object
          required: [jenis, query]
          properties:
            jenis: { const: turats }
            query: { type: string, minLength: 2, maxLength: 120 }
            limit: { type: integer, minimum: 1, maximum: 10 }
          not:
            anyOf:
              - required: [bookId]
                properties: { bookId: {} }
              - required: [pageId]
                properties: { pageId: {} }
        - type: object
          description: Halaman internal Turath; pageId berbeda dari nomor halaman cetak.
          required: [jenis, bookId, pageId]
          properties:
            jenis: { const: turats }
            bookId: { type: integer, minimum: 1, maximum: 10000000 }
            pageId: { type: integer, minimum: 0, maximum: 1000000 }
          not:
            anyOf:
              - required: [query]
                properties: { query: {} }
              - required: [limit]
                properties: { limit: {} }
    LapisanV2:
      type: string
      enum: [norma, tafsir-resmi, praktik, pedoman, dalil, fikih-doktrin]
    PotonganV2:
      type: object
      required: [id, documentId, jenis, judul, rujukan, locator, text, contentHash, identitas, lapisan, sumber, retrievedAt, verificationStatus, mesin, tanda]
      properties:
        id: { type: string }
        documentId: { type: string }
        jenis: { type: string, enum: [peraturan, qanun, putusan-mk, putusan-ma, fatwa, khes, khi, ayat, hadis, turats, literatur] }
        judul: { type: string }
        rujukan: { type: string }
        locator:
          type: object
          description: Lokasi pasal, bagian, halaman, ayat atau kitab sesuai jenis sumber
          additionalProperties: true
        pageStarts:
          type: array
          items:
            type: object
            required: [halaman, offset]
            properties:
              halaman: { type: integer }
              offset: { type: integer }
        text: { type: string }
        contentHash: { type: string, description: Sidik SHA-256 teks }
        transkripsi:
          type: object
          description: Catatan kurasi pendamping opsional, tercakup tanda tangan. Bukan bukti penafsiran atau penelaahan manusia.
          required: [sourceHash, transcriptionHash, sourcePages, reviewKind, reviews]
          properties:
            sourceHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            transcriptionHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            sourcePages: { type: array, minItems: 2, maxItems: 2, items: { type: integer } }
            reviewKind: { const: telaah AI berbasis sumber }
            reviews:
              type: array
              items:
                type: object
                required: [pass, reviewer, reviewedAt]
                properties:
                  pass: { type: integer, enum: [1, 2] }
                  reviewer: { type: string }
                  reviewedAt: { type: string, format: date-time }
        identitas: { type: array, items: { type: string } }
        lapisan: { type: array, items: { $ref: "#/components/schemas/LapisanV2" } }
        sumber:
          type: object
          required: [nama, url, otoritas, status, diubahDengan, dicabutDengan]
          properties:
            nama: { type: string }
            url: { type: string }
            otoritas: { type: string }
            status: { type: [string, "null"] }
            diubahDengan: { type: array, items: { type: string } }
            dicabutDengan: { type: array, items: { type: string } }
            edisi: { type: string }
            versiTranskripsi: { type: string }
            teksTerpotong: { type: boolean }
            ujiMateri:
              type: array
              items:
                type: object
                required: [nomor, url]
                properties:
                  nomor: { type: string }
                  url: { type: string, format: uri }
        retrievedAt: { type: string, format: date-time }
        verificationStatus: { type: string, enum: [verified_live, verified_snapshot] }
        mesin: { type: string }
        tanda: { $ref: "#/components/schemas/TandaV2" }
    HasilBukaV2:
      type: object
      required: [rujukan, status, potongan, peringatan]
      properties:
        rujukan: { $ref: "#/components/schemas/RujukanV2" }
        status: { type: string, enum: [dibuka, tidak_ditemukan, tidak_dapat_diperiksa] }
        alasan: { type: string }
        potongan: { type: array, items: { $ref: "#/components/schemas/PotonganV2" } }
        peringatan: { type: array, items: { type: string } }
    BagianV2:
      type: object
      required: [judul, fokus]
      properties:
        judul: { type: string, minLength: 1, maxLength: 120 }
        fokus: { type: string, minLength: 1, maxLength: 600 }
    HasilSintesisV2:
      type: object
      required: [v, pertanyaan, bagian, model, potongan, potonganDitolak, kalimat, dibuang, analisis, analisisDibuang, dibuatPada, mesin, tanda]
      properties:
        v: { const: 1 }
        pertanyaan: { type: string }
        bagian: { $ref: "#/components/schemas/BagianV2" }
        model:
          type: [object, "null"]
          required: [penyedia, nama]
          properties:
            penyedia: { type: string }
            nama: { type: string }
        potongan:
          type: array
          items:
            type: object
            required: [id, contentHash, rujukan]
            properties:
              id: { type: string }
              contentHash: { type: string }
              rujukan: { type: string }
        potonganDitolak:
          type: array
          items:
            type: object
            required: [id, alasan]
            properties:
              id: { type: string }
              alasan: { type: string }
        kalimat:
          type: array
          items:
            type: object
            required: [id, teks, lapisan, potonganId, kutipan, rentang, halaman]
            properties:
              id: { type: string }
              teks: { type: string }
              lapisan: { $ref: "#/components/schemas/LapisanV2" }
              potonganId: { type: string }
              kutipan: { type: string }
              rentang:
                type: object
                required: [start, end]
                properties:
                  start: { type: integer }
                  end: { type: integer }
              halaman: { type: [integer, "null"] }
        dibuang:
          type: array
          items:
            type: object
            required: [id, teks, alasan, rincian]
            properties:
              id: { type: string }
              teks: { type: string }
              alasan: { type: string }
              rincian: { type: string }
        analisis:
          type: array
          items:
            type: object
            required: [teks, merujuk]
            properties:
              teks: { type: string }
              merujuk: { type: array, items: { type: string } }
        analisisDibuang:
          type: array
          items:
            type: object
            required: [teks, rincian]
            properties:
              teks: { type: string }
              rincian: { type: string }
        cakupan:
          type: object
          description: Cakupan bahan yang benar-benar dipakai kalimat lolos, bukan klaim kecukupan hukum; tercakup tanda tangan.
          required: [v, documentIds, passageIds, batas]
          properties:
            v: { const: 1 }
            documentIds: { type: array, items: { type: string } }
            passageIds: { type: array, items: { type: string } }
            batas: { type: array, items: { type: string } }
        dibuatPada: { type: string, format: date-time }
        mesin: { type: string }
        tanda: { $ref: "#/components/schemas/TandaV2" }
    PeristiwaSintesisV2:
      oneOf:
        - type: object
          required: [jenis, traceId]
          properties:
            jenis: { const: mulai }
            traceId: { type: string, format: uuid }
        - type: object
          required: [jenis]
          properties:
            jenis: { const: proses }
        - type: object
          required: [jenis, data]
          properties:
            jenis: { const: hasil }
            data: { $ref: "#/components/schemas/HasilSintesisV2" }
        - type: object
          required: [jenis, kode, pesan]
          properties:
            jenis: { const: galat }
            kode: { type: string, enum: [DEADLINE, AI_PROVIDER_ERROR] }
            pesan: { type: string }
    Meta:
      type: object
      required: [traceId]
      properties:
        traceId: { type: string, format: uuid }
        nextCursor: { type: [string, "null"] }
    LegalDocument:
      type: object
      required: [id, jurisdiction, authority, documentType, number, year, title, status, effectiveFrom, effectiveTo, canonicalUrl]
      properties:
        id: { type: string }
        jurisdiction: { const: ID }
        authority: { type: string }
        documentType: { type: string }
        number: { type: [string, "null"] }
        year: { type: [string, "null"] }
        title: { type: string }
        status: { type: [string, "null"] }
        effectiveFrom: { type: [string, "null"], format: date }
        effectiveTo: { type: [string, "null"], format: date }
        canonicalUrl: { type: string, format: uri }
    Evidence:
      type: object
      required: [id, documentId, text, locator, provenance]
      properties:
        id: { type: string, pattern: "^ev_[a-f0-9]{24}$" }
        documentId: { type: string }
        text: { type: string }
        locator: { type: object, additionalProperties: true }
        provenance:
          type: object
          required: [sourceName, sourceUrl, authority, retrievedAt, contentHash, indexVersion, verificationStatus]
          properties:
            sourceName: { type: string }
            sourceUrl: { type: string, format: uri }
            authority: { type: string }
            retrievedAt: { type: string, format: date-time }
            contentHash: { type: string, pattern: "^[a-f0-9]{64}$" }
            indexVersion: { type: string }
            verificationStatus:
              type: string
              enum: [verified_live, verified_snapshot, ambiguous, conflicting, insufficient_evidence]
    ResearchResult:
      type: object
      required: [traceId, query, status, summary, claims, evidence, conflicts, warnings, coverage, confidence, generatedAt]
      properties:
        traceId: { type: string, format: uuid }
        query: { type: string }
        status: { type: string, enum: [complete, partial, insufficient_evidence] }
        summary: { type: string }
        claims:
          type: array
          items:
            type: object
            required: [text, evidenceIds]
            properties:
              text: { type: string }
              evidenceIds: { type: array, minItems: 1, items: { type: string } }
        evidence: { type: array, items: { $ref: "#/components/schemas/Evidence" } }
        conflicts: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        coverage: { type: number, minimum: 0, maximum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        generatedAt: { type: string, format: date-time }
    SearchEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [traceId, query, documents, sourceStatus, warnings, nextCursor]
          properties:
            traceId: { type: string, format: uuid }
            query: { type: string }
            documents: { type: array, items: { $ref: "#/components/schemas/LegalDocument" } }
            sourceStatus: { type: object, additionalProperties: { type: string, enum: [ok, failed] } }
            warnings: { type: array, items: { type: string } }
            nextCursor: { type: [string, "null"] }
        meta: { $ref: "#/components/schemas/Meta" }
    CreateUpload:
      type: object
      required: [fileName, contentType, sizeBytes, classification]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 180, pattern: "\\.(pdf|PDF|docx|DOCX)$" }
        contentType:
          type: string
          enum: [application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document]
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400 }
        classification: { type: string, enum: [public, internal, confidential] }
        aiConsent: { type: boolean, default: false }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            traceId: { type: string, format: uuid }
    AskSource:
      type: object
      required: [kind, reference, title, authority, status, url, pdfUrl, amendedBy, revokedBy, warnings, evidenceIds]
      properties:
        kind: { type: string, enum: [regulation, ma-product, fatwa] }
        reference: { type: string }
        title: { type: string }
        authority: { type: string }
        status: { type: [string, "null"] }
        effectiveFrom: { type: [string, "null"] }
        url: { type: [string, "null"] }
        pdfUrl: { type: [string, "null"] }
        amendedBy: { type: array, items: { type: string } }
        revokedBy: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        evidenceIds: { type: array, items: { type: string } }
    AskResponse:
      type: object
      required: [result, sources, candidates, plan, attempted, ai, limits]
      properties:
        result: { $ref: "#/components/schemas/ResearchResult" }
        sources: { type: array, items: { $ref: "#/components/schemas/AskSource" } }
        candidates:
          type: array
          description: Hasil pencarian yang belum dibuka. Bukan evidence.
          items:
            type: object
            properties:
              title: { type: string }
              documentType: { type: string }
              number: { type: [string, "null"] }
              year: { type: [string, "null"] }
              status: { type: [string, "null"] }
              url: { type: string }
        plan:
          type: object
          properties:
            references:
              type: array
              items:
                type: object
                properties:
                  regulation: { type: string }
                  article: { type: string }
            searchQuery: { type: string }
            shariaTopic: { type: [string, "null"] }
            mode: { type: string, enum: [ai, heuristic] }
        attempted: { type: array, items: { type: string } }
        ai:
          oneOf:
            - type: "null"
            - type: object
              properties:
                provider: { type: string }
                model: { type: string }
                used: { type: boolean }
        limits: { type: array, items: { type: string } }
  responses:
    InvalidJson:
      description: Body bukan JSON yang sah
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    GenericSuccess:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {}
              meta: { $ref: "#/components/schemas/Meta" }
    ValidationError:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    PayloadTooLarge:
      description: Payload too large
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    RateLimited:
      description: Request quota exceeded
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    Unavailable:
      description: Optional service is not configured or upstream is unavailable
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
